Se agregó un botón dedicado para **WalletConnect** que autocompleta la dirección de la billetera (como MetaMask, Trust Wallet o Rainbow) en tu campo de texto `userWallet` para que puedas minar directo a esa cuenta.

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minería CHC | CharlyScan Pro</title>
    
    <!-- Librerías para WalletConnect y Web3 -->
    <script src="[https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js](https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js)"></script>
    <script src="[https://cdn.jsdelivr.net/npm/@walletconnect/web3-provider@1.8.0/dist/umd/index.min.js](https://cdn.jsdelivr.net/npm/@walletconnect/web3-provider@1.8.0/dist/umd/index.min.js)"></script>

    <style>
        :root { --gold: #f1c40f; --dark-bg: #0a0a0a; --card-bg: #161616; --blue-scan: #2980b9; --wc-blue: #3B99FC; }
        body { text-align: center; padding: 10px; font-family: 'Segoe UI', Arial, sans-serif; background: var(--dark-bg); color: white; margin: 0; overflow-x: hidden; }
        
        .window-container { max-width: 600px; margin: 20px auto; border: 1px solid #333; border-radius: 15px; overflow: hidden; background: #111; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .window-header { background: #222; padding: 10px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        
        .card-panel { background: var(--card-bg); padding: 20px; margin: 10px; border-radius: 12px; border: 1px solid #222; }
        
        #iframeContainer { width: 95%; height: 300px; border: 2px solid var(--gold); margin: 15px auto; border-radius: 10px; overflow: hidden; background: #000; }
        iframe { width: 100%; height: 100%; border: none; }
        
        input { margin: 10px; padding: 12px; width: 85%; border-radius: 5px; border: 1px solid #444; background: #000; color: #2ecc71; font-family: monospace; text-align: center; }
        
        button { margin: 8px 0; padding: 12px; width: 90%; border-radius: 25px; border: none; cursor: pointer; font-weight: bold; background: var(--gold); color: black; transition: 0.3s; }
        button:hover { transform: scale(1.02); }
        
        .btn-walletconnect { background: var(--wc-blue); color: white; display: flex; align-items: center; justify-content: center; gap: 8px; margin: 10px auto; }
        .chc-counter { font-size: 1.8em; color: var(--gold); margin: 10px 0; font-weight: bold; }
        .wallet-link { color: #3498db; text-decoration: underline; font-size: 0.85em; display: block; margin: 10px 0; cursor: pointer; }
        .btn-home { background: #333; color: white; padding: 5px 15px; border-radius: 5px; text-decoration: none; font-size: 0.8em; }

        #modalExplorador {
            display: none; 
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            z-index: 9999;
            flex-direction: column;
        }
        .modal-header {
            background: #1a1a1a;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--blue-scan);
        }
        .btn-cerrar {
            background: #e74c3c;
            color: white;
            padding: 8px 20px;
            border-radius: 5px;
            font-size: 0.9em;
            text-decoration: none;
            cursor: pointer;
            border: none;
            width: auto;
        }
        #iframeExplorador {
            flex-grow: 1;
            width: 100%;
            border: none;
        }
    </style>
</head>
<body onload="verificarMemoria()">

<div id="modalExplorador">
    <div class="modal-header">
        <span style="color: var(--blue-scan); font-weight: bold;">🔍 CHARLY SCAN EXPLORER</span>
        <button class="btn-cerrar" onclick="cerrarExplorador()">← VOLVER A MINAR</button>
    </div>
    <iframe id="iframeExplorador" src=""></iframe>
</div>

<div class="window-container">
    <div class="window-header">
        <a href="next_page.html" class="btn-home">🏠 HOME</a>
        <span style="font-size: 0.9em; font-weight: bold; color: var(--gold);">CHARLY MINER PRO</span>
        <a href="videos.html" class="btn-home" style="background: #27ae60;">VIDEOS</a>
    </div>

    <div class="card-panel">
        <h2>MINERÍA ACTIVA</h2>
        <input type="text" id="userWallet" placeholder="Pega tu dirección CHC o conecta tu Wallet..." onkeypress="handleKeyPress(event)" list="prevWallets" />
        <datalist id="prevWallets"></datalist> 
        
        <!-- Botón Integrado de WalletConnect -->
        <button class="btn-walletconnect" id="btnConnectWC" onclick="conectarWalletConnect()">
            <span data-id="selected-provider-walletconnect">🔗 Conectar con WalletConnect</span>
        </button>

        <span onclick="gestionarIdentidad()" class="wallet-link">¿No tienes cuenta? Generar nueva local</span>

        <div class="chc-counter">💰 <span id="chcCount">0</span> CHC</div>
        <div id="minerStatus" style="font-size: 0.8em; color: #888;">Panel de control listo</div>
    </div>

    <div id="iframeContainer">
      <iframe id="iframeRedireccion" src="[https://tareasunamyunadm.blogspot.com](https://tareasunamyunadm.blogspot.com)"></iframe>
    </div>

    <div style="padding: 10px;">
        <button onclick="continuarMineria()">🚀 INICIAR MINERÍA</button>
        <button style="background:#e74c3c; color:white;" onclick="pararMineria()">🛑 DETENER</button>
        
        <button style="background: var(--blue-scan); color: white;" onclick="abrirExplorador()">🔍 ABRIR CHARLY SCAN (FULLSCREEN)</button>
    </div>
</div>

<script>
    const NODO_URL = "[https://binance-bot-hna7.onrender.com](https://binance-bot-hna7.onrender.com)";
    const MASTER_PUBLIC = "93aab2b2ee274042d81954cd6569085ac3f1f660d600e6c7ca3aa11adbf94e62544ff783541316f3c7269d751079414e879f18804dde24c1b83c70c4e13cd4ee";
    const urls = [
        "[https://tareasunamyunadm.blogspot.com](https://tareasunamyunadm.blogspot.com)", 
        "[https://faucentminialtcrypto.blogspot.com](https://faucentminialtcrypto.blogspot.com)", 
        "[https://solotareamsmex.blogspot.com](https://solotareamsmex.blogspot.com)", 
        "[https://juegospcmexico.blogspot.com](https://juegospcmexico.blogspot.com)"
    ];
    
    let segundos = 0, chcGanados = 0, interval = null, minando = false;
    let RecompensaPendiente = 0;
    let wcProvider = null;

    // --- INTEGRACIÓN CON WALLETCONNECT ---
    async function conectarWalletConnect() {
        try {
            document.getElementById('minerStatus').innerText = "Abriendo WalletConnect...";
            
            // Inicialización de proveedor público de WalletConnect (BSC / Ethereum compatible)
            wcProvider = new WalletConnectProvider.default({
                rpc: {
                    56: "[https://bsc-dataseed.binance.org/](https://bsc-dataseed.binance.org/)",
                    1: "[https://rpc.ankr.com/eth](https://rpc.ankr.com/eth)"
                },
                qrcodeModalOptions: {
                    mobileLinks: ["metamask", "trust", "rainbow", "tokenpocket"]
                }
            });

            // Habilitar la sesión (Abre el modal QR o conexión directa en móviles)
            await wcProvider.enable();

            const web3Provider = new ethers.providers.Web3Provider(wcProvider);
            const signer = web3Provider.getSigner();
            const walletAddress = await signer.getAddress();

            // Guardar dirección obtenida en el campo de wallet
            document.getElementById('userWallet').value = walletAddress;
            localStorage.setItem("last_chc_wallet", walletAddress);
            document.getElementById('btnConnectWC').innerText = "✅ Billetera Conectada";
            document.getElementById('minerStatus').innerText = "Conectado a WalletConnect con éxito.";

            // Escuchar desconexión
            wcProvider.on("disconnect", (code, reason) => {
                document.getElementById('btnConnectWC').innerText = "🔗 Conectar con WalletConnect";
                document.getElementById('minerStatus').innerText = "WalletConnect desconectado.";
            });

        } catch (error) {
            console.error("Error al conectar con WalletConnect:", error);
            document.getElementById('minerStatus').innerText = "Error o conexión cancelada.";
        }
    }

    function abrirExplorador() {
        const modal = document.getElementById('modalExplorador');
        const frame = document.getElementById('iframeExplorador');
        
        if (frame.src !== NODO_URL + "/") {
            frame.src = NODO_URL;
        }
        
        modal.style.display = "flex";
        document.body.style.overflow = "hidden";
    }

    function cerrarExplorador() {
        document.getElementById('modalExplorador').style.display = "none";
        document.body.style.overflow = "auto";
    }

    function redireccionAleatoria() {
        document.getElementById('iframeRedireccion').src = urls[Math.floor(Math.random() * urls.length)];
    }
    setInterval(redireccionAleatoria, 25000);

    function verificarMemoria() {
        const saved = localStorage.getItem("last_chc_wallet");
        if (saved) {
            document.getElementById('userWallet').value = saved;
            const dl = document.getElementById('prevWallets');
            const opt = document.createElement('option');
            opt.value = saved;
            dl.appendChild(opt);
        }
    }

    function contarTiempo() {
        const wallet = document.getElementById('userWallet').value.trim();
        if (minando && wallet.length > 5) {
            segundos++;
            
            // Cada 2 segundos suma 1 CHC local
            if (segundos % 2 === 0) {
                chcGanados++;
                RecompensaPendiente++;
                document.getElementById('chcCount').innerText = chcGanados;
            }

            // Cada 10 segundos liquida en la Blockchain las recompensas acumuladas
            if (segundos % 10 === 0 && RecompensaPendiente > 0) {
                const montoAEnviar = RecompensaPendiente;
                RecompensaPendiente = 0;
                enviarAlNodo(wallet, montoAEnviar);
            }

            document.getElementById('minerStatus').innerText = `Minando... (Bloque actual: #${segundos})`;
        }
    }

    async function enviarAlNodo(receptor, monto) {
        try {
            document.getElementById('minerStatus').innerText = `Sincronizando bloque con el nodo...`;
            const respuesta = await fetch(`${NODO_URL}/transferir`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({ 
                    emisor: MASTER_PUBLIC, 
                    receptor: receptor, 
                    monto: Number(monto), 
                    firma: "WEB_MINING_REWARD" 
                })
            });

            if (!respuesta.ok) {
                throw new Error(`HTTP Error status: ${respuesta.status}`);
            }

            const resultado = await respuesta.json();
            console.log("Transacción confirmada en CharlyScan:", resultado);
            document.getElementById('minerStatus').innerText = `¡Bloque minado y registrado exitosamente!`;
            
            // Actualizar iframe del explorador si está abierto para reflejar cambios
            const frame = document.getElementById('iframeExplorador');
            if (document.getElementById('modalExplorador').style.display === "flex") {
                frame.contentWindow.location.reload();
            }

        } catch (error) {
            console.error("Error en conexión con el nodo CHC:", error);
            document.getElementById('minerStatus').innerText = `Error enviando al nodo. Reintentando...`;
            RecompensaPendiente += monto;
        }
    }

    function continuarMineria() {
        const wallet = document.getElementById('userWallet').value.trim();
        if (wallet.length < 5) return alert("Por favor ingresa una billetera válida.");
        if (!minando) {
            minando = true;
            localStorage.setItem("last_chc_wallet", wallet);
            if (!interval) interval = setInterval(contarTiempo, 1000);
            document.getElementById('minerStatus').innerText = "Minería en ejecución";
        }
    }

    function pararMineria() {
        minando = false;
        if (interval) {
            clearInterval(interval);
            interval = null;
        }
        if (RecompensaPendiente > 0) {
            const wallet = document.getElementById('userWallet').value.trim();
            enviarAlNodo(wallet, RecompensaPendiente);
            RecompensaPendiente = 0;
        }
        document.getElementById('minerStatus').innerText = `Minería detenida. Total: ${chcGanados} CHC`;
    }

    function gestionarIdentidad() {
        let p = prompt("¿ANDROID o PC?").toLowerCase();
        if (p === "android" || p === "pc") {
            const array = new Uint8Array(32);
            window.crypto.getRandomValues(array);
            const privateKey = Array.from(array).map(b => b.toString(16).padStart(2, '0')).join('');
            const publicKey = "chc_" + privateKey.substring(0, 40);
            alert("Nueva llave CHC: " + publicKey + "\n\nCopiada al panel.");
            document.getElementById('userWallet').value = publicKey;
            localStorage.setItem("last_chc_wallet", publicKey);
        }
    }

    function handleKeyPress(e) { if (e.keyCode === 13) { continuarMineria(); } }
</script>

</body>
</html>
